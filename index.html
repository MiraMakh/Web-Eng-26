      <form>
        <fieldset>
          <legend>personal info</legend>
          <h2>Personal info</h2>
          <label for="firstName">First Name</label>

            <option value="Male">Male</option>
            <option value="other">Other</option>
          </select>
        </fieldset>
        <fieldset>
          <legend>education</legend>
          <h2>Education</h2>
          <label>Choose you degree</label>
          <label for="bach">bach</label>
          <input type="checkbox" name="degree" id="bach" value="bach" />
          <label for="magiste">magiste</label>
          <input type="checkbox" name="degree" id="magiste" value="magister" />
          <label for="PHD">magiste</label>
          <input type="checkbox" name="degree" id="PHD" value="PHD" /> <br />
          <label>Choose you status right now</label>
          <label for="bach1">bach</label>
          <input type="radio" name="degree1" id="bach1" value="bach" />
          <label for="magiste1">magiste</label>
          <input type="radio" name="degree1" id="magiste1" value="magister" />
          <label for="PHD1">magiste</label>
          <input type="radio" name="degree1" id="PHD1" value="PHD" /> <br />
          <label for="notStudent">I am not student right now</label>
          <input
            type="radio"
            name="degree1"
            id="notStudent"
            value="not student"
          />
          <input type="file" />
          <br />
          <fieldset>
            <legend>user</legend>
            <h2>User</h2>
            <input
              type="email"
              name="email"
              placeholder="Enter your email address"
            />
            <input
              type="password"
              name="password"
              placeholder="Enter your password"
            />
            <textarea placeholder="enter you thought or comment"> </textarea>
            <input type="reset" value="reset data" />
